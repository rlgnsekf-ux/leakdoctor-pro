<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101d30"><title>누수닥터 PRO</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><style>body{font-family:system-ui,sans-serif;background:#101d30;color:#eef5ff;margin:0}main{max-width:650px;margin:auto;padding:18px}h1{font-size:24px}.card{background:#20324b;border-radius:15px;padding:16px;margin:12px 0}button,input,select{font:inherit;border-radius:9px;padding:10px}button{background:#1679f5;color:white;border:0;margin:3px}button:disabled{opacity:.45}input,select{background:#eaf1f9;color:#142339;max-width:95%}video{width:100%;max-height:260px;object-fit:contain;background:#000;border-radius:12px}canvas{width:100%;background:#16253a;border-radius:10px}.muted{color:#aebfd6;font-size:13px}.big{font-size:30px;font-weight:700}label{display:block;margin:9px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid>div{background:#15263d;padding:12px;border-radius:10px}#status{color:#ffcf72}</style></head><body><main><h1>💧 누수닥터 PRO 1.0</h1><p class="muted">디지털 압력계 4~5자리 인식 · 실험용 현장 기록 앱</p><section class="card"><h3>① 카메라 인식</h3><video id="video" autoplay playsinline muted></video><div><button id="camera">카메라 켜기</button><button id="scan" disabled>자동 인식 시작</button><button id="stopScan" disabled>인식 중지</button></div><p class="muted">숫자 표시부를 화면 중앙에 크게 맞추세요. 밝고 흔들림 없는 환경이 필요합니다.</p><label>숫자 형식 <select id="format"><option value="auto">자동 소수점</option><option value="0">정수</option><option value="1">소수점 1자리</option><option value="2">소수점 2자리</option><option value="3">소수점 3자리</option><option value="4">소수점 4자리</option></select></label><label>압력 단위 <select id="unit"><option>bar</option><option>MPa</option><option>kPa</option><option>psi</option></select></label><p id="status">카메라 대기 중</p><div class="big" id="reading">—</div><p class="muted" id="raw">인식값 없음</p><label>수동 입력 / 인식 보정 <input id="manual" type="number" step="any" placeholder="예: 5.000"><button id="add">기록</button></label></section><section class="card"><h3>② 측정</h3><div class="grid"><div>경과 시간<div class="big" id="timer">00:00</div></div><div>측정값 수<div class="big" id="count">0</div></div><div>시작 압력<div id="first">—</div></div><div>최근 압력<div id="last">—</div></div><div>압력 변화<div id="delta">—</div></div><div>분당 감소<div id="rate">—</div></div></div><p><button id="start">측정 시작</button><button id="finish" disabled>측정 종료</button><button id="reset">초기화</button></p><canvas id="graph" width="600" height="210"></canvas></section><section class="card"><h3>③ 진단</h3><p id="result">측정 대기 중</p><p class="muted">이 앱은 압력 추세를 관찰하는 보조 도구입니다. 누수 확정이나 일반/미세누수 구분에는 시험 매체, 배관 체적·재질, 온도, 압력계 정확도, 밸브 상태와 반복 검사가 필요합니다.</p><button id="export">CSV 기록 내보내기</button></section></main><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script>
const $=id=>document.getElementById(id);let stream=null,worker=null,scanning=false,measuring=false,started=0,records=[],tick=null,busy=false;const time=()=>Math.max(0,(performance.now()-started)/1000);function clock(t){return String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0')}function num(x){return Number(x).toFixed(5)}function status(s){$('status').textContent=s}async function camera(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});$('video').srcObject=stream;$('scan').disabled=false;status('카메라 준비 완료')}catch(e){status('카메라 권한 또는 HTTPS 연결을 확인하세요: '+e.message)}}$('camera').onclick=camera;
function parse(s){s=s.replace(/[,]/g,'.').replace(/[^0-9.]/g,'');let m=s.match(/\d+(?:\.\d+)?/g)||[];let v=m.sort((a,b)=>b.length-a.length)[0];if(!v)return null;const fmt=$('format').value;if(fmt!=='auto'){let digits=v.replace(/\D/g,'');if(digits.length<4||digits.length>5)return null;v=String(Number(digits)/Math.pow(10,Number(fmt)))}else if(v.replace(/\D/g,'').length<4||v.replace(/\D/g,'').length>5)return null;let n=Number(v);return Number.isFinite(n)?n:null}
async function scan(){if(busy||!scanning)return;busy=true;try{if(!worker){status('숫자 인식 엔진 준비 중 (인터넷 필요)');worker=await Tesseract.createWorker('eng');await worker.setParameters({tessedit_char_whitelist:'0123456789.,',tessedit_pageseg_mode:'7'})}const v=$('video'),c=document.createElement('canvas');c.width=900;c.height=300;const ctx=c.getContext('2d');let w=v.videoWidth,h=v.videoHeight;if(!w||!h)return;ctx.drawImage(v,w*.12,h*.30,w*.76,h*.40,0,0,c.width,c.height);const {data}=await worker.recognize(c);const val=parse(data.text);$('raw').textContent='원문: '+(data.text.trim()||'인식 실패')+' · 신뢰도 '+Math.round(data.confidence)+'%';if(val!==null&&data.confidence>=65){$('reading').textContent=val+' '+$('unit').value;status('인식됨 · 화면 숫자와 일치하는지 확인');if(measuring)record(val)}else status('인식 불안정 · 카메라 각도/밝기 조정 또는 수동 입력')}catch(e){status('인식 오류: '+e.message)}finally{busy=false;if(scanning)setTimeout(scan,1000)}}$('scan').onclick=()=>{scanning=true;$('scan').disabled=true;$('stopScan').disabled=false;scan()};$('stopScan').onclick=()=>{scanning=false;$('scan').disabled=false;$('stopScan').disabled=true;status('자동 인식 중지')};function record(v){if(!measuring)return;let t=time();if(records.length&&t-records.at(-1).t<.75)return;records.push({t,v,unit:$('unit').value});draw()}$('add').onclick=()=>{let v=Number($('manual').value);if(!$('manual').value||!Number.isFinite(v))return; $('reading').textContent=v+' '+$('unit').value;if(measuring)record(v)};$('start').onclick=()=>{records=[];started=performance.now();measuring=true;$('start').disabled=true;$('finish').disabled=false;$('unit').disabled=true;tick=setInterval(draw,250);draw()};$('finish').onclick=()=>{measuring=false;clearInterval(tick);$('start').disabled=false;$('finish').disabled=true;$('unit').disabled=false;draw()};$('reset').onclick=()=>{measuring=false;clearInterval(tick);records=[];$('start').disabled=false;$('finish').disabled=true;$('unit').disabled=false;$('timer').textContent='00:00';draw()};function draw(){let t=measuring?time():(records.at(-1)?.t||0),u=$('unit').value;$('timer').textContent=clock(t);$('count').textContent=records.length;let a=records[0],b=records.at(-1);$('first').textContent=a?num(a.v)+' '+u:'—';$('last').textContent=b?num(b.v)+' '+u:'—';let d=a&&b?a.v-b.v:0,dt=a&&b?b.t-a.t:0;$('delta').textContent=dt>0?num(d)+' '+u:'—';$('rate').textContent=dt>0?num(d/dt*60)+' '+u+'/분':'—';$('result').textContent=records.length<3?'최소 3회 이상의 측정값이 필요합니다.':d>0?'압력 하강 관찰됨 — 계기 오차와 온도·시험 조건 확인 후 재검사 필요':d<0?'압력 상승 관찰됨 — 온도·계기 상태 확인 필요':'표시 압력 변화 없음 — 누수 부재를 확정할 수 없음';let c=$('graph'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);x.fillStyle='#16253a';x.fillRect(0,0,c.width,c.height);if(records.length<2)return;let min=Math.min(...records.map(r=>r.v)),max=Math.max(...records.map(r=>r.v));if(max===min){min-=.01;max+=.01}let span=Math.max(1,b.t-a.t);x.strokeStyle='#55c5ff';x.lineWidth=3;x.beginPath();records.forEach((r,i)=>{let px=35+(r.t-a.t)/span*530,py=175-(r.v-min)/(max-min)*145;i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke();x.fillStyle='#d8e8ff';x.font='14px sans-serif';x.fillText(max.toFixed(4),5,18);x.fillText(min.toFixed(4),5,194)}$('export').onclick=()=>{let rows=['seconds,pressure,unit',...records.map(r=>[r.t.toFixed(2),r.v,r.unit].join(','))];let blob=new Blob(['\ufeff'+rows.join('\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='누수닥터_압력기록.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}</script></body></html>
